# 앱 내부 리버스 프록시 — compose가 80을 호스트 ${APP_PORT}(기본 7777)에 매핑 (서버 엣지 nginx와 별개).
# 라우팅: /api → backend(FastAPI), 나머지 → frontend(Next.js)
# 보안 헤더 주의: X-Frame-Options·frame-ancestors를 추가하지 않는다 — Keycloak silent renew가 /login을 숨은 iframe으로 로드한다.

upstream frontend {
    server frontend:3000;
}

upstream backend {
    server backend:8000;
}

server {
    listen 80;

    location /api/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # AI 호출은 느린 GPU에서 기본 60s를 넘길 수 있다 — 프록시가 먼저 끊으면 504
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        # SOP 원문 첨부 업로드 여유 — nginx 기본 1MB면 413
        client_max_body_size 50m;
    }

    location / {
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Next.js HMR/웹소켓 (개발 모드 대비)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
