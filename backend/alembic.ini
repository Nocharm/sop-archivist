# Alembic 설정 — 접속 URL은 여기에 두지 않는다. alembic/env.py가 run_migrations(url) 인자 또는
# settings.database_url(.env · compose 환경 변수)에서 가져온다. CLI는 backend/ 에서:
#   .venv/bin/alembic upgrade head
#   .venv/bin/alembic revision --autogenerate --rev-id 0002 -m "add xxx"   (리비전 id는 0002, 0003 ... 순번 문자열)

[alembic]
# %(here)s = 이 파일이 있는 디렉터리 — cwd와 무관하게 같은 경로로 풀린다.
script_location = %(here)s/alembic

# env.py가 `from app...`을 import할 수 있도록 backend/ 를 sys.path 앞에 둔다.
prepend_sys_path = %(here)s

path_separator = os

[post_write_hooks]

# Logging configuration (CLI 실행에만 적용 — 앱 안에서 부르면 env.py가 건너뛴다)
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
