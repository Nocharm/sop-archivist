# 배포 런타임(Dockerfile `python:3.11-slim`)에 린트를 고정한다. 로컬 venv가 3.12+면
# PEP 695 제네릭 같은 상위 문법이 로컬 테스트를 통과한 뒤 서버에서 import SyntaxError로
# 죽는다 — 형제 프로젝트 bpm이 2026-08-31 backend 기동 불능을 겪은 원인이다. Dockerfile 베이스를 올릴 때 같이 올릴 것.
target-version = "py311"

[lint]
# 기본(E4·E7·E9·F)에 더해: B 흔한 버그 꼴, BLE 모든 예외 삼키기(경계에서만 `# noqa: BLE001 -- 사유`), UP 3.11 문법, TID 금지 import.
# 신뢰 기반 계획 스텝 1(2026-11-19-trust-foundation-plan.md).
extend-select = ["B", "BLE", "UP", "TID"]

[lint.flake8-bugbear]
# FastAPI 의존성 선언은 기본값 자리의 호출이 정상이다.
extend-immutable-calls = [
    "fastapi.Depends", "fastapi.Query", "fastapi.File", "fastapi.Form", "fastapi.Body",
    "fastapi.Header", "fastapi.Path", "fastapi.Security", "app.sop.ai.schemas.JobKindIn",
]

[lint.flake8-tidy-imports.banned-api]
# 시각은 전부 KST tz-aware(app.clock.now()) — 맨 datetime은 서버(UTC)와 로컬에서 다른 값을 낸다.
"datetime.datetime.now".msg = "Use app.clock.now() (KST, tz-aware)."
"datetime.datetime.utcnow".msg = "Use app.clock.now() (KST, tz-aware)."
"datetime.datetime.today".msg = "Use app.clock.now() (KST, tz-aware)."
"datetime.date.today".msg = "Use app.clock.now().date()."

[lint.per-file-ignores]
"app/clock.py" = ["TID251"]
