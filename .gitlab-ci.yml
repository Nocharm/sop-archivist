# GitLab CI for SOP Archivist (company GitLab, server deploy runner). Two stacks on the same server:
#   dev        :4444  deploy-dev         — automatic on every push to `dev`, without waiting for the tests
#   production :7777  deploy-production  — manual ▶ on `main`, after the tests pass
# Tests run on merge requests, `dev` and `main`; on `dev` they report beside the deploy.
# Runner setup, project settings, rollback and the emergency manual path: docs/deploy/gitlab-runner.md.
# Keep this file free of hostnames, IPs, secrets and pull_policy (that lives in the runner config).

workflow:
  rules:
    # A dev → main MR would only repeat the dev branch pipeline of the same commit.
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME == "dev"
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "push" && ($CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_BRANCH == "dev")
    - if: $CI_PIPELINE_SOURCE == "web"
    # Anything else (feature-branch pushes, tag pushes) makes no pipeline, so a branch with
    # an open MR never gets a duplicate branch pipeline.

stages:
  - test
  - deploy

backend-test:
  stage: test
  tags: [sop-archivist-test]
  image: python:3.11-slim
  interruptible: true
  variables:
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
    PIP_DISABLE_PIP_VERSION_CHECK: "1"
  cache:
    key:
      prefix: pip
      files: [backend/requirements.txt, backend/requirements-dev.txt]
    paths: [.cache/pip]
  script:
    - cd backend
    - python -m pip install -r requirements-dev.txt
    - ruff check app/ tests/
    # conftest pins AUTH/AI/HR settings to the baseline, so no CI variables are needed.
    # Parallel workers, each with its own sqlite file (conftest). Capped so a busy runner keeps memory headroom.
    - python -m pytest tests/ -q -n auto --maxprocesses=4

frontend-test:
  stage: test
  tags: [sop-archivist-test]
  image: node:24.22.1-alpine
  interruptible: true
  variables:
    npm_config_cache: "$CI_PROJECT_DIR/.cache/npm"
  cache:
    key:
      prefix: npm
      files: [frontend/package-lock.json]
    paths: [.cache/npm]
  script:
    - cd frontend
    - npm ci
    - npm run lint
    - npx tsc --noEmit -p tsconfig.json
    - npx vitest run
    # No `npm run build` here: the deploy's image build runs it.

deploy-script-test:
  stage: test
  tags: [sop-archivist-test]
  # Same busybox userland as deploy-production; no Docker socket (the test fakes docker).
  image: docker:27-cli
  interruptible: true
  script:
    - sh ci/test-deploy.sh

# Shared by both deploy jobs. The deploy runner is Protected, so it only takes jobs from
# protected branches: `main` and `dev` are both in Settings → Repository → Protected branches.
.deploy:
  stage: deploy
  # Protected runner with the host Docker socket and both deploy folders mounted at the same path.
  tags: [sop-archivist-deploy]
  image: docker:27-cli
  interruptible: false
  timeout: 45 minutes
  script:
    - sh ci/deploy.sh

# The stack is chosen here, never by a project CI/CD variable (it would apply to both jobs).
# Folders: production reads SOP_DEPLOY_DIR, dev reads SOP_DEV_DEPLOY_DIR (script defaults otherwise).
deploy-dev:
  extends: .deploy
  # Fast feedback: the dev stack deploys at once and the tests report beside it. main stays gated.
  needs: []
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"
  variables:
    SOP_DEPLOY_ENV: dev
  resource_group: sop-archivist-dev
  environment:
    name: dev
    deployment_tier: development

deploy-production:
  extends: .deploy
  needs: [backend-test, frontend-test, deploy-script-test]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      # The main pipeline waits as "blocked" until ▶ is pressed; a failed deploy fails it.
      allow_failure: false
  variables:
    SOP_DEPLOY_ENV: production
  resource_group: sop-archivist-production
  environment:
    name: production
    deployment_tier: production
